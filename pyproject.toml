[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indexnow-tool"
version = "1.0.0"
description = "Submit URLs to IndexNow from a local web UI or CLI, with per-project keys, deduplication, and live progress."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dawid Jóźwiak", email = "jozwiakdawid@gmail.com" }]
keywords = ["indexnow", "seo", "bing", "search", "indexing", "sitemap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/dawid-ai/indexnow-tool"
Issues = "https://github.com/dawid-ai/indexnow-tool/issues"

[project.scripts]
indexnow = "indexnow_tool.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["indexnow_tool"]

[tool.hatch.build.targets.sdist]
include = ["indexnow_tool", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
