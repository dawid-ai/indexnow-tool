name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Install from pyproject with unpinned dependencies on purpose: a released
      # dependency that changes an API should break CI, not someone's install.
      - run: pip install -e ".[dev]"
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t indexnow-tool:ci .
      - name: Refuses to serve the network without a password
        run: |
          if docker run --rm indexnow-tool:ci; then
            echo "Container started without AUTH_PASSWORD; it must refuse."
            exit 1
          fi
      - name: Serves and gates the UI when a password is set
        run: |
          docker run -d --name ci -e AUTH_PASSWORD=ci-password -p 8787:8787 indexnow-tool:ci
          for i in $(seq 30); do
            curl -fsS http://localhost:8787/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8787/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/)" = "303"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/api/runs/1)" = "401"
          curl -s -c /tmp/c.txt -o /dev/null -X POST http://localhost:8787/login -d "password=ci-password"
          test "$(curl -s -b /tmp/c.txt -o /dev/null -w '%{http_code}' http://localhost:8787/)" = "200"
          docker rm -f ci
